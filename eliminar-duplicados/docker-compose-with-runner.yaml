services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_RUNNERS_ENABLED=false
      #- N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=$N8N_RUNNERS_AUTH_TOKEN
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_EXECUTE_COMMAND_ALLOW=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ~/Sites/n8n/n8n-python/eliminar-duplicados:/files
    networks:
      - n8n_net

  runners:
    image: n8nio/runners:2.3.2
    container_name: n8n-runners
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    networks:
      - n8n_net

volumes:
  n8n_data:
    external: true #ya existe

networks:
  n8n_net:
    external: true #ya existe
